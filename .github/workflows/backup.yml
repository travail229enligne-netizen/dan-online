name: Sauvegarde MongoDB

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Installer MongoDB Database Tools
        run: |
          curl -fsSL https://pgp.mongodb.com/server-7.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-7.0.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update
          sudo apt-get install -y mongodb-database-tools

      - name: Exporter la base de données
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          mkdir -p backup
          mongodump --uri="$MONGO_URI" --out=backup/dump

      - name: Compresser la sauvegarde
        run: tar -czf backup-$(date +%Y-%m-%d).tar.gz -C backup dump

      - name: Archiver la sauvegarde
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-backup-${{ github.run_id }}
          path: backup-*.tar.gz
          retention-days: 90

services:
  - type: web
    name: dan-online-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DEFAULT_COMMISSION_RATE
        value: 10
      - key: CLIENT_URL
        sync: false
